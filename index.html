<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Delivery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">🍜</div>
          <h1>Food Delivery</h1>
        </div>
        <div class="control">
          <div class="search">
            <svg
              class="search-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M21 21l-4.3-4.3"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              ></path>
              <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2"
              ></circle>
            </svg>
            <input
              type="text"
              name=""
              id="searchFood"
              placeholder="Tìm món ăn theo tên... (vd: pizza, phở)"
              autocomplete="off"
            />
          </div>
          <span id="counter" class="counter"></span>
        </div>
      </header>
      <main>
        <section id="status" class="loading" role="status" hidden="">
          
        </section>
        <section id="grid" class="grid"></section>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
